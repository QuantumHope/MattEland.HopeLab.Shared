# Build and test every pull request and push. Every push to main that passes also publishes the packages to nuget.org
# as MattEland.HopeLab.*.<major>.<minor>.<commits on main>, through nuget.org Trusted Publishing (no stored key; see the
# publish job).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A PR's newer push cancels its older run. Pushes to main each get their own group: GitHub keeps only one pending run per
# group, so sharing one would silently drop a queued push (and its publish).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Git identity for the tests' temporary repositories
        run: |
          git config --global user.name "HopeLab CI"
          git config --global user.email "ci@hopelab.invalid"
          git config --global init.defaultBranch main
      - run: dotnet build MattEland.HopeLab.Shared.slnx -c Release
      - run: dotnet test MattEland.HopeLab.Shared.slnx -c Release --no-build --blame-hang-timeout 5m

  installers:
    name: Installers and release helper
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse
        run: |
          bash -n installers/install.sh
          bash -n installers/linux/build-deb.sh
          shellcheck -S error installers/install.sh installers/linux/build-deb.sh
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/installers/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host "::error::$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
      - name: Release helper and .deb builder, on the example app
        run: |
          cfg=installers/examples/hopelab-app.json
          python3 installers/release/hopelab_release.py env "$cfg"
          v=$(python3 installers/release/hopelab_release.py version "$cfg" 42); echo "version $v"; [ "$v" = "0.1.42" ]
          pub=$(mktemp -d); mkdir -p "$pub"
          printf '#!/bin/sh\necho demo\n' > "$pub/Demo"; chmod +x "$pub/Demo"; cp "$pub/Demo" "$pub/demo-cli"
          python3 installers/release/hopelab_release.py stamp "$cfg" 0.1.42 linux-x64 o/r abc "$pub"
          grep -q '"executable": "Demo"' "$pub/hopelab-install.json"
          bash installers/linux/build-deb.sh "$pub" 0.1.42 dist "$cfg"
          dpkg-deb --contents dist/demo_0.1.42_amd64.deb | grep -q './opt/demo/Demo'
          dpkg-deb --contents dist/demo_0.1.42_amd64.deb | grep -q './usr/bin/demo-cli -> /opt/demo/demo-cli'
          sudo apt-get install -y ./dist/demo_0.1.42_amd64.deb
          # Installed as root, used by everyone: the folder and its files must be readable without sudo.
          [ "$(stat -c %a /opt/demo)" = 755 ] || { echo "/opt/demo is $(stat -c %a /opt/demo)"; exit 1; }
          grep -q '"package": "deb"' /opt/demo/release.json
          demo-cli
          sudo apt-get remove -y demo
          touch "dist/Demo-0.1.42-win-x64.zip" "dist/Demo-0.1.42-linux-x64.tar.gz"
          python3 installers/release/hopelab_release.py manifest "$cfg" 0.1.42 v0.1.42 abc dist
          python3 -c 'import json; m=json.load(open("dist/latest.json")); assert set(m["assets"])=={"win-x64","linux-x64","linux-x64.deb"}, m; assert m["install"]["executable"]=="Demo"'
          python3 installers/release/hopelab_release.py installers "$cfg" o/r . dist
          grep -q 'REPO="o/r"' dist/install.sh
          grep -q "BakedRepo = 'o/r'" dist/install.ps1

  # Trusted Publishing: no stored API key. GitHub issues this job an OIDC token, NuGet/login exchanges it for an API key
  # that lasts an hour, and nuget.org accepts it because a Trusted Publishing policy on the package owner's account
  # names this repository and this workflow file (ci.yml). A manual run on main publishes too (after setting the policy
  # up, say); re-running a commit is harmless, since --skip-duplicate skips a version that is already there.
  publish:
    needs: [test, installers]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the OIDC token NuGet/login trades for a temporary API key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack
        run: |
          base=$(sed -n 's:.*<Version>\([0-9]*\.[0-9]*\)\.[0-9]*</Version>.*:\1:p' Directory.Build.props)
          version="$base.$(git rev-list --count HEAD)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          dotnet pack MattEland.HopeLab.Shared.slnx -c Release -p:Version="$version" -o artifacts
          ls artifacts
      - name: NuGet login (OIDC to a temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          # The nuget.org profile name that owns the packages and the Trusted Publishing policy (not an email address).
          # A repository variable NUGET_USER overrides it.
          user: ${{ vars.NUGET_USER || 'MattEland' }}
      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
          echo "Published MattEland.HopeLab.* $VERSION to nuget.org" >> "$GITHUB_STEP_SUMMARY"
